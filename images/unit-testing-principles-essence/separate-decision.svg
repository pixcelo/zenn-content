<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="'Yu Gothic','Meiryo','Noto Sans JP',sans-serif">
  <rect width="1200" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#2563eb"/>
    </marker>
  </defs>

  <text x="600" y="52" font-size="28" font-weight="bold" fill="#334155" text-anchor="middle">判断を切り出すと、テストの守り方が分かれる</text>

  <!-- 左：切り出す前 -->
  <rect x="40" y="90" width="520" height="520" rx="16" fill="#fff1f0" stroke="#e5484d" stroke-width="3"/>
  <text x="300" y="135" font-size="26" font-weight="bold" fill="#c62828" text-anchor="middle">切り出す前</text>

  <!-- 1か所に混ざったサービス -->
  <rect x="190" y="175" width="340" height="240" rx="12" fill="#ffffff" stroke="#334155" stroke-width="3"/>
  <text x="360" y="205" font-size="20" fill="#334155" text-anchor="middle">サービス</text>
  <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6">
    <line x1="280" y1="265" x2="440" y2="355"/>
    <line x1="440" y1="265" x2="280" y2="355"/>
    <line x1="280" y1="265" x2="280" y2="355"/>
    <line x1="440" y1="265" x2="440" y2="355"/>
  </g>
  <g font-size="20" fill="#334155" text-anchor="middle">
    <rect x="215" y="240" width="130" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="280" y="272">判断</text>
    <rect x="375" y="240" width="130" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="272">DB読み書き</text>
    <rect x="215" y="330" width="130" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="280" y="362">DB読み書き</text>
    <rect x="375" y="330" width="130" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="362">判断</text>
  </g>

  <!-- テスト・ダブルが並ぶ -->
  <g font-size="18" fill="#c62828" text-anchor="middle">
    <rect x="60" y="190" width="100" height="38" rx="8" fill="#ffffff" stroke="#e5484d" stroke-width="2"/>
    <text x="110" y="215">モック</text>
    <rect x="60" y="245" width="100" height="38" rx="8" fill="#ffffff" stroke="#e5484d" stroke-width="2"/>
    <text x="110" y="270">スタブ</text>
    <rect x="60" y="300" width="100" height="38" rx="8" fill="#ffffff" stroke="#e5484d" stroke-width="2"/>
    <text x="110" y="325">スタブ</text>
    <rect x="60" y="355" width="100" height="38" rx="8" fill="#ffffff" stroke="#e5484d" stroke-width="2"/>
    <text x="110" y="380">モック</text>
  </g>
  <g stroke="#e5484d" stroke-width="2">
    <line x1="160" y1="209" x2="190" y2="230"/>
    <line x1="160" y1="264" x2="190" y2="275"/>
    <line x1="160" y1="319" x2="190" y2="315"/>
    <line x1="160" y1="374" x2="190" y2="360"/>
  </g>

  <text x="300" y="480" font-size="21" fill="#475569" text-anchor="middle">テスト・ダブルを並べないと</text>
  <text x="300" y="510" font-size="21" fill="#475569" text-anchor="middle">確かめられない</text>
  <text x="300" y="565" font-size="21" font-weight="bold" fill="#c62828" text-anchor="middle">整理するたびに赤くなりやすい</text>

  <!-- 中央の矢印 -->
  <path d="M570,350 L626,350" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- 右：切り出した後 -->
  <rect x="640" y="90" width="520" height="520" rx="16" fill="#f0f7ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="900" y="135" font-size="26" font-weight="bold" fill="#1e3a8a" text-anchor="middle">切り出した後</text>

  <!-- 判断（受け取った値だけで答える） -->
  <text x="900" y="182" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">単体テスト：細かく、速く</text>
  <rect x="760" y="200" width="280" height="90" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="900" y="238" font-size="26" font-weight="bold" fill="#1e3a8a" text-anchor="middle">判断</text>
  <text x="900" y="272" font-size="17" fill="#475569" text-anchor="middle">受け取った値だけで答えを返す</text>

  <!-- 読み書きと判断の往復 -->
  <path d="M820,388 L820,296" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="808" y="348" font-size="17" fill="#1e3a8a" text-anchor="end">入力（読んだ値）</text>
  <path d="M980,292 L980,384" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="992" y="348" font-size="17" fill="#1e3a8a" text-anchor="start">出力（判断の結果）</text>

  <!-- 薄い読み書きの部分 -->
  <rect x="700" y="390" width="400" height="44" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="419" font-size="19" fill="#334155" text-anchor="middle">読み書き（薄い部分）</text>

  <!-- データベース -->
  <line x1="900" y1="434" x2="900" y2="458" stroke="#64748b" stroke-width="2"/>
  <path d="M850,470 L850,515 A50,12 0 0 0 950,515 L950,470" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <ellipse cx="900" cy="470" rx="50" ry="12" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="900" y="505" font-size="17" fill="#334155" text-anchor="middle">DB</text>
  <text x="900" y="572" font-size="20" font-weight="bold" fill="#1e3a8a" text-anchor="middle">統合テスト：要所だけ、少なく</text>

</svg>
